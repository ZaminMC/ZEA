plugins {
        id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
        archivesName = project.archives_base_name
}

repositories {
        // MoulConfig (configuration framework) is published on the NEU maven.
        maven {
                name = 'NotEnoughUpdates'
                url = 'https://maven.notenoughupdates.org/releases/'
        }
}

dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

        // MoulConfig ships as a Fabric mod: bundled jar-in-jar, kept as its own
        // unmodified LGPL jar at runtime.
        implementation "org.notenoughupdates.moulconfig:modern-26.3:${project.moulconfig_version}"
        include "org.notenoughupdates.moulconfig:modern-26.3:${project.moulconfig_version}"

        testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher:${project.junit_launcher_version}"
        testRuntimeOnly "org.slf4j:slf4j-simple:${project.slf4j_version}"
}

test {
        useJUnitPlatform()
}

processResources {
        def version = project.version

        inputs.property "version", version

        filesMatching("fabric.mod.json") {
                expand "version": version
        }
}

tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
}

java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
}

jar {
        def archiveName = project.base.archivesName.get()

        from("LICENSE") {
                rename { "${it}_${archiveName}" }
        }
}
