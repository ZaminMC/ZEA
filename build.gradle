plugins {
        id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
        archivesName = project.archives_base_name
}

repositories {
        // MoulConfig (configuration framework) is published on the NEU maven.
        maven {
                name = 'NotEnoughUpdates'
                url = 'https://maven.notenoughupdates.org/releases/'
        }
        // ModMenu (settings-screen integration) is published on the
        // Terraformers maven.
        maven {
                name = 'TerraformersMC'
                url = 'https://maven.terraformersmc.com/releases/'
        }
}

dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

        // MoulConfig ships as a Fabric mod: bundled jar-in-jar, kept as its own
        // unmodified LGPL jar at runtime.
        implementation "org.notenoughupdates.moulconfig:modern-26.3:${project.moulconfig_version}"
        include "org.notenoughupdates.moulconfig:modern-26.3:${project.moulconfig_version}"

        // MoulConfig is written in Kotlin and its jar declares no Kotlin
        // dependency — its slider editor loads Kotlin classes on first use,
        // so /zea crashed with NoClassDefFoundError unless another mod
        // happened to ship a Kotlin runtime (the live pack did not). Fabric
        // Language Kotlin is the canonical bundling vehicle: a small Fabric
        // mod nesting the Kotlin stdlib; the loader deduplicates it against
        // any copy the pack already carries.
        implementation "net.fabricmc:fabric-language-kotlin:${project.flk_version}"
        include "net.fabricmc:fabric-language-kotlin:${project.flk_version}"

        // The Kotlin runtime above is nested inside FLK where a plain JVM
        // cannot see it; the processor-level config tests need the stdlib
        // directly.
        testRuntimeOnly "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"

        // ModMenu is present in dev runs for the config-screen entrypoint to
        // attach to, but stays optional at runtime — ZEA works without it and
        // bundles nothing: players who want the mod-list button install
        // ModMenu themselves.
        implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

        testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher:${project.junit_launcher_version}"
        testRuntimeOnly "org.slf4j:slf4j-simple:${project.slf4j_version}"
}

test {
        useJUnitPlatform()
}

processResources {
        def version = project.version

        inputs.property "version", version

        filesMatching("fabric.mod.json") {
                expand "version": version
        }
}

tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
}

java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
}

jar {
        def archiveName = project.base.archivesName.get()

        from("LICENSE") {
                rename { "${it}_${archiveName}" }
        }
}
